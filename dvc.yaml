stages:

  augment:
    cmd: python trainer/scripts/augment.py
    deps:
      - trainer/scripts/augment.py
      - trainer/src/ds_covid/augmentation.py
      - data/raw
    params:
      - params.yaml:
          - augment
          - preprocess.classes
          - preprocess.max_samples_per_class
          - preprocess.test_split
          - preprocess.random_seed
    outs:
      - data/augmented
    metrics:
      - outputs/augment_stats.json:
          cache: false

  preprocess:
    cmd: python trainer/scripts/preprocess.py
    deps:
      - trainer/scripts/preprocess.py
      - trainer/src/ds_covid/preprocessing.py
      - data/augmented
    params:
      - params.yaml:
          - preprocess
    outs:
      - data/processed/X_train.npy
      - data/processed/X_test.npy
      - data/processed/y_train.npy
      - data/processed/y_test.npy
    metrics:
      - outputs/preprocess_stats.json:
          cache: false

  train:
    cmd: python trainer/scripts/train.py
    deps:
      - trainer/scripts/train.py
      - trainer/src/ds_covid/models.py
      - data/processed/X_train.npy
      - data/processed/y_train.npy
    params:
      - params.yaml:
          - train
          - mlflow
          - preprocess.img_size
          - preprocess.random_seed
    outs:
      - data/models/covid_model.keras
    metrics:
      - outputs/metrics.json:
          cache: false

  evaluate:
    cmd: python trainer/scripts/evaluate.py
    deps:
      - trainer/scripts/evaluate.py
      - data/models/covid_model.keras
      - data/processed/X_test.npy
      - data/processed/y_test.npy
    outs:
      - outputs/evaluation_report.json:
          cache: false
