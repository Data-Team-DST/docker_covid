stages:

  augment:
    cmd: python trainer/scripts/augment.py
    deps:
      - trainer/scripts/augment.py
      - trainer/deep_learning/augmentation.py
      - data/raw
    params:
      - params.yaml:
          - augment
          - preprocess.classes
          - preprocess.max_samples_per_class
          - preprocess.test_split
          - preprocess.random_seed
    outs:
      - data/augmented
    metrics:
      - outputs/augment_stats.json:
          cache: false

  preprocess:
    cmd: python trainer/scripts/preprocess.py
    deps:
      - trainer/scripts/preprocess.py
      - trainer/deep_learning/preprocessing.py
      - data/augmented
    params:
      - params.yaml:
          - preprocess
    outs:
      - data/processed/X_train.npy
      - data/processed/X_test.npy
      - data/processed/y_train.npy
      - data/processed/y_test.npy
    metrics:
      - outputs/preprocess_stats.json:
          cache: false

  train:
    cmd: python trainer/scripts/train.py
    deps:
      - trainer/scripts/train.py
      - trainer/deep_learning/models.py
      - data/processed/X_train.npy
      - data/processed/y_train.npy
    params:
      - params.yaml:
          - train
          - mlflow
          - preprocess.img_size
          - preprocess.random_seed
    outs:
      - data/models/covid_model.keras
    metrics:
      - outputs/metrics.json:
          cache: false

  evaluate:
    cmd: python trainer/scripts/evaluate.py
    deps:
      - trainer/scripts/evaluate.py
      - data/models/covid_model.keras
      - data/processed/X_test.npy
      - data/processed/y_test.npy
    outs:
      - outputs/evaluation_report.json:
          cache: false

  preprocess_segmentation:
    cmd: python trainer/scripts/preprocess_segmentation.py
    deps:
      - trainer/scripts/preprocess_segmentation.py
      - trainer/deep_learning/segmentation.py
      - data/augmented
    params:
      - params.yaml:
          - preprocess.img_size
          - preprocess.classes
    outs:
      - data/processed/segmentation/X_train.npy
      - data/processed/segmentation/X_test.npy
      - data/processed/segmentation/M_train.npy
      - data/processed/segmentation/M_test.npy
    metrics:
      - outputs/preprocess_segmentation_stats.json:
          cache: false

  train_segmentation:
    cmd: python trainer/scripts/train_segmentation.py
    deps:
      - trainer/scripts/train_segmentation.py
      - trainer/deep_learning/segmentation.py
      - trainer/deep_learning/data.py
      - data/processed/segmentation/X_train.npy
      - data/processed/segmentation/M_train.npy
    params:
      - params.yaml:
          - segmentation
          - mlflow
          - preprocess.img_size
          - preprocess.random_seed
    outs:
      - data/models/lung_unet.keras
    metrics:
      - outputs/segmentation_metrics.json:
          cache: false

  evaluate_segmentation:
    cmd: python trainer/scripts/evaluate_segmentation.py
    deps:
      - trainer/scripts/evaluate_segmentation.py
      - trainer/deep_learning/segmentation.py
      - data/models/lung_unet.keras
      - data/processed/segmentation/X_test.npy
      - data/processed/segmentation/M_test.npy
    params:
      - params.yaml:
          - segmentation.batch_size
          - segmentation.clean_mask_components
          - segmentation.clean_mask_closing_kernel
    outs:
      - outputs/segmentation_evaluation_report.json:
          cache: false
