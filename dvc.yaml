stages:

  augment:
    cmd: python scripts/augment.py
    deps:
      - scripts/augment.py
      - backend/src/ds_covid/augmentation.py
      - data/raw
    params:
      - params.yaml:
          - augment
          - preprocess.classes
          - preprocess.max_samples_per_class
          - preprocess.test_split
          - preprocess.random_seed
    outs:
      - data/augmented
    metrics:
      - outputs/augment_stats.json:
          cache: false

  preprocess:
    cmd: python scripts/preprocess.py
    deps:
      - scripts/preprocess.py
      - backend/src/ds_covid/preprocessing.py
      - data/augmented
    params:
      - params.yaml:
          - preprocess
    outs:
      - data/processed/X_train.npy
      - data/processed/X_test.npy
      - data/processed/y_train.npy
      - data/processed/y_test.npy
    metrics:
      - outputs/preprocess_stats.json:
          cache: false

  train:
    cmd: python scripts/train.py
    deps:
      - scripts/train.py
      - backend/src/ds_covid/models.py
      - data/processed/X_train.npy
      - data/processed/y_train.npy
    params:
      - params.yaml:
          - train
          - mlflow
          - preprocess.img_size
          - preprocess.random_seed
    outs:
      - data/models/covid_model.keras
    metrics:
      - outputs/metrics.json:
          cache: false

  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - scripts/evaluate.py
      - data/models/covid_model.keras
      - data/processed/X_test.npy
      - data/processed/y_test.npy
    outs:
      - outputs/evaluation_report.json:
          cache: false

  preprocess_segmentation:
    cmd: python scripts/preprocess_segmentation.py
    deps:
      - scripts/preprocess_segmentation.py
      - backend/src/ds_covid/segmentation.py
      - data/augmented
    params:
      - params.yaml:
          - preprocess.img_size
          - preprocess.classes
    outs:
      - data/processed/segmentation/X_train.npy
      - data/processed/segmentation/X_test.npy
      - data/processed/segmentation/M_train.npy
      - data/processed/segmentation/M_test.npy
    metrics:
      - outputs/preprocess_segmentation_stats.json:
          cache: false

  train_segmentation:
    cmd: python scripts/train_segmentation.py
    deps:
      - scripts/train_segmentation.py
      - backend/src/ds_covid/segmentation.py
      - backend/src/ds_covid/data.py
      - data/processed/segmentation/X_train.npy
      - data/processed/segmentation/M_train.npy
    params:
      - params.yaml:
          - segmentation
          - mlflow
          - preprocess.img_size
          - preprocess.random_seed
    outs:
      - data/models/lung_unet.keras
    metrics:
      - outputs/segmentation_metrics.json:
          cache: false

  evaluate_segmentation:
    cmd: python scripts/evaluate_segmentation.py
    deps:
      - scripts/evaluate_segmentation.py
      - backend/src/ds_covid/segmentation.py
      - data/models/lung_unet.keras
      - data/processed/segmentation/X_test.npy
      - data/processed/segmentation/M_test.npy
    params:
      - params.yaml:
          - segmentation.batch_size
          - segmentation.clean_mask_components
          - segmentation.clean_mask_closing_kernel
    outs:
      - outputs/segmentation_evaluation_report.json:
          cache: false
