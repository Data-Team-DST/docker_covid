      - id: US-18
        title: "Prometheus + instrumentation FastAPI"
        description: "Instrumentation via prometheus_client (pas prometheus-fastapi-instrumentator — préfixe de métrique par défaut incompatible avec ds_covid_ imposé par alert_rules.yml). 8 métriques sur /metrics : uptime, model_loaded, predictions_total, http_requests_total{status,path} (middleware toutes routes), inference_latency_seconds (histogram), auth_failures_total, low_confidence_predictions_total, predictions_by_class_total{predicted_class}. Voir docs/us-verification.md."
        blocks: ["US-19", "US-20"]
        points: 4
        priority: MUST
        done: true
      - id: US-19
        title: "Grafana dashboard (≥5 panels + alertes)"
        description: "✅ infrastructure/docker/monitoring/grafana/provisioning/dashboards/covid_backend.json : 10 panels (6 existants + 4 ajoutés — latence p50/p95, taux d'erreurs HTTP 5xx, distribution des prédictions par classe, % prédictions à faible confiance en proxy de la confiance moyenne, le backend ne loguant pas de score moyen brut). Alertes déjà présentes dans alert_rules.yml (InferenceLatencyHigh p95>1s, HighHttpErrorRate>5%, + bonus : auth failures, low confidence, class imbalance, no traffic). Provisioning automatique via docker-compose (updateIntervalSeconds: 30, pas de rebuild nécessaire)."
        depends_on: ["US-18"]
        points: 5
        priority: MUST
        done: true
      - id: US-20
        title: "Evidently : détection dérive données"
        description: "✅ trainer/scripts/drift_report.py : Report Evidently (DataDriftPreset stattest=psi, seuil 0.2 + ColumnDriftMetric jensenshannon par classe), comparaison scores de prédiction production (log-service /v1/logs, logger app.predict.telemetry) vs référence train (échantillon 500 images). Rapport HTML en 1 commande, versionné DVC (outputs/drift/report.html.dvc, remote minio), embarqué en iframe sur demonstration :5051 /monitoring. Nuance vs formulation d'origine : dérive mesurée sur les scores de sortie par classe, pas sur la distribution brute des pixels d'entrée — approche standard pour du monitoring de classification, mais à noter si quelqu'un cherchait explicitement du pixel-level drift."
        depends_on: ["US-18"]
        blocks: ["US-21"]
        points: 5
        priority: MUST
        done: true
