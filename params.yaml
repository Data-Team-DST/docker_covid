augment:
  # Split train/test fait ici, sur les images brutes, AVANT augmentation — seul le
  # train est augmenté (cf. preprocess.test_split/random_seed ci-dessous, utilisés
  # par augment.py pour ce split). Le test ne contient que des originaux non augmentés.
  variants_per_image: 3          # + 1 original = x4 sur le TRAIN uniquement (~17k -> ~68k train, ~4k test)
  rotation_range: 15             # degrés, +/-
  zoom_range: [0.9, 1.1]
  brightness_range: [0.8, 1.2]
  flip_horizontal: true
  random_seed: 42                # seed des transformations d'augmentation (indépendant du split ci-dessus)

preprocess:
  img_size: [256, 256]
  max_samples_per_class: 1500  # limite par classe sur les images BRUTES (null = toutes) — utilisé par augment.py
                                # valeur intermédiaire (TODO.md #1, option C) : valide le pipeline complet
                                # + les fixes #9/#10/#12 sur un vrai run avant le run final (null) pré-soutenance
  test_split: 0.2                # part réservée au test, prélevée avant augmentation — utilisé par augment.py
  random_seed: 42                # seed du split train/test (augment.py) ET du split train/val (train.py)
  masking: true                 # applique le mask de segmentation des poumons
  cropping: true                 # recadre + padde sur la région des poumons (nécessite masking)
  clahe: true                    # améliore le contraste local (CLAHE)
  clahe_clip_limit: 2.0           # limite de contraste CLAHE (plus haut = plus de contraste, plus de bruit amplifié)
  clahe_tile_grid_size: [8, 8]    # taille de la grille CLAHE (nombre de tuiles par axe)
  denoising_method: null         # "gaussian" ou null pour aucun denoising
  classes:
    COVID: 0
    Normal: 1
    "Viral Pneumonia": 2
    Lung_Opacity: 3

train:
  epochs: 30              # EarlyStopping arrête avant si val_loss stagne (patience: 5)
  batch_size: 32
  learning_rate: 0.001
  val_split: 0.15          # part de X_train réservée à la validation (early stopping / LR schedule)

segmentation:
  # U-Net (encoder MobileNetV2 pré-entraîné) pour la segmentation pulmonaire — génère le
  # mask des images de predict/ (qui n'en ont pas), pour appliquer à l'inférence le même
  # masking/crop que celui du pipeline de classification (cf. preprocess.masking/cropping).
  val_split: 0.15                # part du train (data/augmented/train) réservée à la validation
  freeze_epochs: 8                # phase 1 : encoder gelé, seul le decoder apprend
  freeze_lr: 0.001
  fine_tune_epochs: 25             # phase 2 : encoder dégelé, fine-tuning complet
  fine_tune_lr: 0.00001            # LR très bas : affiner sans détruire les poids ImageNet
  batch_size: 16                   # phase 1 : 32 déclenche un OOM GPU (RTX 3060 12GB) : 9.22GiB demandés
                                    # pour un seul op alors que 8.75GiB seulement étaient libres
  fine_tune_batch_size: 8          # phase 2 plus gourmande en mémoire (gradients sur tout le réseau) —
                                    # 16 déclenche un OOM GPU (RTX 3060 12GB) : 9.16GiB demandés pour un
                                    # seul op lors du unfreeze complet de l'encoder MobileNetV2
  clean_mask_components: 2         # post-traitement : nombre de composantes connexes à garder
  clean_mask_closing_kernel: 15    # taille du noyau de fermeture morphologique
  min_val_dice: 0.5                # seuil minimum de val_dice sous lequel le modèle n'est PAS
                                    # enregistré dans le MLflow Model Registry (reste artefact du
                                    # run uniquement) — valeur provisoire, à recalibrer par Steven
                                    # une fois de vraies métriques d'entraînement disponibles
                                    # (TODO.md #12 ; comparaison à un modèle "Production" existant
                                    # volontairement hors scope, cf. CHANTIER_INFRA_SERVICES.md #4)

mlflow:
  experiment_name: ds_covid_cnn
  tracking_uri: http://mlflow:5000
  model_name: covid_xray_cnn
  segmentation_experiment_name: ds_covid_unet_segmentation
  segmentation_model_name: lung_segmentation_unet
