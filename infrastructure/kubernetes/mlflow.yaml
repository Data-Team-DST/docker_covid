apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ds-covid
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          # python:3.11-slim nu ne contient pas mlflow — utiliser l'image buildée
          # depuis infrastructure/docker/mlflow/Dockerfile (mlflow+boto3+psycopg2).
          # :latest est mutable — substituer par le tag sha-<court> publié en CI
          # une fois le déploiement K8s automatisé (Phase 3, US-23).
          image: ds-covid-mlflow:sha-CHANGEME
          imagePullPolicy: IfNotPresent
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)
            - --artifacts-destination=s3://mlflow-artifacts
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ds-covid-config
            - secretRef:
                name: ds-covid-secrets
          # Limite relevée 512Mi → 1Gi (2026-08-24, US-23) : mlflow server démarre
          # 4 workers gunicorn (dimensionnés sur le nb de cœurs), chacun avec
          # mlflow+boto3+psycopg2 chargés — dépassait 512Mi et se faisait
          # OOM-kill (exit 137) une fois déployé sur un vrai cluster K8s, où
          # les limits sont réellement appliquées (contrairement à Compose
          # classique, qui ignore deploy.resources hors mode Swarm).
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: ds-covid
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
