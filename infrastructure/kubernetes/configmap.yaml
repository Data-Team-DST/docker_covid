# Le Secret ds-covid-secrets vit dans secrets.yaml (gitignoré, jamais commité) —
# voir secrets.yaml.example pour le gabarit à copier avant tout déploiement.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-covid-config
  namespace: ds-covid
data:
  API_ENV: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
  MLFLOW_S3_ENDPOINT_URL: "http://minio-service:9000"
  AWS_DEFAULT_REGION: "us-east-1"
