# Règles d'alerte — DS_COVID Backend.
#
# On alerte sur des SYMPTÔMES observables (latence, erreurs, proportion de
# prédictions incertaines, déséquilibre des 4 classes) plutôt que sur un
# seuil de "précision du modèle" : en production, le vrai label (diagnostic
# médical confirmé) n'est pas disponible immédiatement, donc ces métriques
# proxy sont ce qu'on peut surveiller en continu avant l'analyse Evidently
# prévue en Phase 4 (cf. roadmap README : "Monitoring, Evidently, Drift").

groups:
  - name: ds_covid_api_alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Le backend DS_COVID ne répond plus"
          description: "Prometheus n'arrive plus à scraper backend:8000/metrics depuis 1 minute."

      - alert: HighHttpErrorRate
        expr: |
          sum(rate(ds_covid_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(ds_covid_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs HTTP 5xx > 5% sur 5 minutes"
          description: "Vérifier les logs backend (make logs) et le dernier déploiement."

      - alert: InferenceLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(ds_covid_inference_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 de latence d'inférence > 1s"
          description: "Le modèle TensorFlow est anormalement lent (CPU saturé, pas de GPU, image trop grande)."

      - alert: RepeatedAuthFailures
        expr: increase(ds_covid_auth_failures_total[5m]) > 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 20 échecs d'authentification X-API-Key en 5 minutes"
          description: "Peut indiquer une clé mal configurée côté client, ou une tentative d'accès non autorisé."

  - name: ds_covid_model_alerts
    rules:
      - alert: HighProportionLowConfidence
        expr: |
          sum(rate(ds_covid_low_confidence_predictions_total[15m]))
          /
          sum(rate(ds_covid_predictions_total[15m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 30% des prédictions récentes ont une confiance < 0.6"
          description: >
            Signal précoce de dérive des données d'entrée (nouvelle source
            de radios, qualité d'image différente de l'entraînement).
            À confirmer avec l'analyse Evidently prévue en Phase 4.

      - alert: ClassDistributionImbalanced
        expr: |
          max by () (
            sum(rate(ds_covid_predictions_by_class_total[30m])) by (predicted_class)
          )
          /
          sum(rate(ds_covid_predictions_by_class_total[30m])) > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Une classe dépasse 80% des prédictions récentes"
          description: >
            Sur 4 classes (COVID, Lung_Opacity, Normal, Viral_Pneumonia),
            une telle concentration est suspecte -> vérifier le pipeline
            d'entrée avant de faire confiance aux prédictions.

      - alert: NoTrafficReceived
        expr: sum(rate(ds_covid_http_requests_total{path="/api/v1/predict"}[15m])) == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Aucun appel à /api/v1/predict depuis 15 minutes"
          description: "Vérifier que le frontend Streamlit ou les clients API envoient bien des requêtes."